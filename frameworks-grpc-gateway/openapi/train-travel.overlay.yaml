overlay: 1.1.0
info:
  title: Train Travel OAS3.1 Customizations
  version: 1.0.0
  description: >-
    Applies deterministic API metadata, operation metadata, and x-speakeasy
    extension fields to the OpenAPI document generated by protoc-gen-openapiv3.
actions:
  - target: $.info
    update:
      title: Train Travel API
      version: 1.2.1
      description: API for finding and booking train trips across Europe.
      contact:
        name: Train Support
        url: https://example.com/support
        email: support@example.com
      license:
        name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
        url: https://creativecommons.org/licenses/by-nc-sa/4.0/

  - target: $.servers
    update:
      - url: https://api.example.com/
        description: Production

  - target: $.tags
    update:
      - name: Stations
        description: Find and filter train stations across Europe, including their location and local timezone.
      - name: Trips
        description: Timetables and routes for train trips between stations, including pricing and availability.
      - name: Bookings
        description: Create and manage bookings for train trips, including passenger details and optional extras.
      - name: Payments
        description: |
          Pay for bookings using a card or bank account, and view payment
          status and history.

          > warn
          > Bookings usually expire within 1 hour so you'll need to make your payment
          > before the expiry date 

  - target: $.paths['/v1/stations'].get
    update:
      operationId: get-stations
      summary: Get a list of train stations
      tags:
        - Stations

  - target: $.paths['/v1/trips'].get
    update:
      operationId: get-trips
      summary: Get available train trips
      tags:
        - Trips

  - target: $.paths['/v1/bookings'].get
    update:
      operationId: get-bookings
      summary: List existing bookings
      tags:
        - Bookings

  - target: $.paths['/v1/bookings'].post
    update:
      operationId: create-booking
      summary: Create a booking
      tags:
        - Bookings

  - target: $.paths['/v1/bookings/{booking_id}'].get
    update:
      operationId: get-booking
      summary: Get a booking
      tags:
        - Bookings
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 60000
          maxElapsedTime: 3600000
          exponent: 1.5
        statusCodes:
          - 5XX
        retryConnectionErrors: true

  - target: $.paths['/v1/bookings/{booking_id}'].delete
    update:
      operationId: delete-booking
      summary: Delete a booking
      tags:
        - Bookings

  - target: $
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 60000
          maxElapsedTime: 3600000
          exponent: 1.5
        statusCodes:
          - 5XX
        retryConnectionErrors: true
