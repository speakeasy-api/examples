openapi: "3.1.0"
info:
  title: "Train Travel API"
  version: "1.2.1"
  description: API for finding and booking train trips across Europe.
  contact:
    name: Train Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /v1/stations:
    get:
      tags:
        - "TrainTravelService"
        - Stations
      summary: "Get a list of train stations"
      description: "Returns a paginated and searchable list of all train stations."
      operationId: "get-stations"
      parameters:
        - name: "empty"
          in: "query"
          schema:
            type: "object"
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.ListStationsResponse"
  /v1/trips:
    get:
      tags:
        - "TrainTravelService"
        - Trips
      summary: "Get available train trips"
      description: "Returns a list of available train trips between the specified origin and\ndestination stations on the given date."
      operationId: "get-trips"
      parameters:
        - name: "origin"
          in: "query"
          description: "The ID of the origin station."
          schema:
            type: "string"
        - name: "destination"
          in: "query"
          description: "The ID of the destination station."
          schema:
            type: "string"
        - name: "date"
          in: "query"
          description: "The date and time of the trip in ISO 8601 format."
          schema:
            type: "string"
        - name: "bicycles"
          in: "query"
          description: "Only return trips where bicycles are allowed."
          schema:
            type: "boolean"
        - name: "dogs"
          in: "query"
          description: "Only return trips where dogs are allowed."
          schema:
            type: "boolean"
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.GetTripsResponse"
  /v1/bookings:
    get:
      tags:
        - "TrainTravelService"
        - Bookings
      summary: "List existing bookings"
      description: "Returns a list of all trip bookings by the authenticated user."
      operationId: "get-bookings"
      parameters:
        - name: "empty"
          in: "query"
          schema:
            type: "object"
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.ListBookingsResponse"
    post:
      tags:
        - "TrainTravelService"
        - Bookings
      summary: "Create a booking"
      description: "A booking is a temporary hold on a trip. It is not confirmed until the\npayment is processed."
      operationId: "create-booking"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/speakeasy.Booking"
        required: true
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A booking for a train trip."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.Booking"
  /v1/bookings/{booking_id}:
    get:
      tags:
        - "TrainTravelService"
        - Bookings
      summary: "Get a booking"
      description: "Returns the details of a specific booking."
      operationId: "get-booking"
      parameters:
        - name: "booking_id"
          in: "path"
          description: "The ID of the booking to retrieve."
          required: true
          schema:
            type: "string"
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A booking for a train trip."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.Booking"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 60000
          maxElapsedTime: 3600000
          exponent: 1.5
        statusCodes:
          - 5XX
        retryConnectionErrors: true
    delete:
      tags:
        - "TrainTravelService"
        - Bookings
      summary: "Delete a booking"
      description: "Deletes a booking, cancelling the hold on the trip."
      operationId: "delete-booking"
      parameters:
        - name: "booking_id"
          in: "path"
          description: "The ID of the booking to delete."
          required: true
          schema:
            type: "string"
      responses:
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/google.rpc.Status"
        "200":
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/speakeasy.DeleteBookingResponse"
components:
  schemas:
    google.rpc.Status:
      type: "object"
      description: "The Status type defines a logical error model suitable for different programming environments."
      properties:
        code:
          type: "integer"
          format: "int32"
          description: "The status code, which should be an enum value of google.rpc.Code."
        details:
          type: "array"
          description: "A list of messages that carry the error details."
          items:
            type: "object"
            properties:
              '@type':
                type: "string"
            additionalProperties: true
        message:
          type: "string"
          description: "A developer-facing error message."
    speakeasy.Booking:
      type: "object"
      description: "A booking for a train trip."
      properties:
        has_bicycle:
          type: "boolean"
          description: "Indicates whether the passenger has a bicycle."
        has_dog:
          type: "boolean"
          description: "Indicates whether the passenger has a dog."
        id:
          type: "string"
          description: "Unique identifier for the booking."
        passenger_name:
          type: "string"
          description: "Name of the passenger."
        trip_id:
          type: "string"
          description: "Identifier of the booked trip."
      required:
        - "trip_id"
        - "passenger_name"
    speakeasy.DeleteBookingResponse:
      type: "object"
    speakeasy.GetTripsResponse:
      type: "object"
      properties:
        trips:
          type: "array"
          items:
            $ref: "#/components/schemas/speakeasy.Trip"
    speakeasy.ListBookingsResponse:
      type: "object"
      properties:
        bookings:
          type: "array"
          items:
            $ref: "#/components/schemas/speakeasy.Booking"
    speakeasy.ListStationsResponse:
      type: "object"
      properties:
        stations:
          type: "array"
          items:
            $ref: "#/components/schemas/speakeasy.Station"
    speakeasy.Station:
      type: "object"
      description: "A train station."
      properties:
        address:
          type: "string"
          description: "The address of the station."
        country_code:
          type: "string"
          description: "The country code of the station."
        id:
          type: "string"
          description: "Unique identifier for the station."
        name:
          type: "string"
          description: "The name of the station."
        timezone:
          type: "string"
          description: "The timezone of the station in IANA format."
      required:
        - "id"
        - "name"
        - "address"
        - "country_code"
    speakeasy.Trip:
      type: "object"
      description: "A train trip between two stations."
      properties:
        arrival_time:
          type: "string"
          description: "The arrival time in ISO 8601 format."
        bicycles_allowed:
          type: "boolean"
          description: "Indicates whether bicycles are allowed on the trip."
        departure_time:
          type: "string"
          description: "The departure time in ISO 8601 format."
        destination:
          type: "string"
          description: "The ID of the destination station."
        dogs_allowed:
          type: "boolean"
          description: "Indicates whether dogs are allowed on the trip."
        id:
          type: "string"
          description: "Unique identifier for the trip."
        operator:
          type: "string"
          description: "The name of the operator of the trip."
        origin:
          type: "string"
          description: "The ID of the origin station."
        price:
          type: "number"
          format: "double"
          description: "The cost of the trip."
tags:
  - name: "TrainTravelService"
  - name: Stations
    description: Find and filter train stations across Europe, including their location and local timezone.
  - name: Trips
    description: Timetables and routes for train trips between stations, including pricing and availability.
  - name: Bookings
    description: Create and manage bookings for train trips, including passenger details and optional extras.
  - name: Payments
    description: "Pay for bookings using a card or bank account, and view payment\nstatus and history.\n\n> warn\n> Bookings usually expire within 1 hour so you'll need to make your payment\n> before the expiry date \n"
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 500
    maxInterval: 60000
    maxElapsedTime: 3600000
    exponent: 1.5
  statusCodes:
    - 5XX
  retryConnectionErrors: true
