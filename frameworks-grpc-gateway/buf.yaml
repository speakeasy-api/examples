version: v2
modules:
  - path: proto
    name: buf.build/speakeasy-api/speakeasy-grpc-gateway-example
deps:
  - buf.build/googleapis/googleapis
lint:
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
  disallow_comment_ignores: true
breaking:
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
